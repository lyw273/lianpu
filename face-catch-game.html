<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>脸谱大师 - 手势抓取游戏</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: "PingFang SC","Microsoft YaHei",sans-serif; }

#video { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; transform: scaleX(-1); z-index: 0; }

#overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 2; pointer-events: none; }

#hand-indicator {
  position: fixed; z-index: 8; pointer-events: none; display: none;
  width: 60px; height: 60px;
  border-radius: 50%; border: 3px solid #FFD700;
  background: rgba(255,215,0,0.15);
  transition: border-color 0.15s, background 0.15s, transform 0.15s;
  transform: translate(-50%, -50%);
}
#hand-indicator.grabbing {
  border-color: #FF4444; background: rgba(255,68,68,0.25);
  transform: translate(-50%, -50%) scale(1.2);
}
#hand-icon {
  position: fixed; z-index: 9; pointer-events: none; display: none;
  font-size: 2rem; transform: translate(-50%, -50%);
  filter: drop-shadow(0 2px 8px rgba(0,0,0,0.9));
  user-select: none;
}

#catch-toast {
  position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(20px);
  background: rgba(0,0,0,0.85); border: 2px solid #FFD700;
  border-radius: 20px; padding: 16px 32px;
  color: #FFD700; font-size: 1.3rem; z-index: 20;
  display: none; align-items: center; gap: 16px;
  box-shadow: 0 0 30px rgba(255,215,0,0.4);
  opacity: 0; transition: opacity 0.3s, transform 0.3s;
}
#catch-toast.show { display: flex; opacity: 1; transform: translateX(-50%) translateY(0); }
#catch-toast .mask-icon { width: 60px; height: 60px; }
#catch-toast .msg { line-height: 1.5; }
#catch-toast .msg .highlight { color: #FF6B00; font-weight: bold; font-size: 1.5rem; }

#score-bar {
  position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
  background: rgba(0,0,0,0.7); border: 2px solid #FFD700;
  border-radius: 40px; padding: 8px 30px;
  color: #FFD700; font-size: 1.2rem; z-index: 5;
  display: none; align-items: center; gap: 20px;
}
#caught-name {
  color: #FF6B00; font-size: 1rem; display: none;
}

#hint {
  position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
  background: rgba(0,0,0,0.7); color: #FFD700; padding: 12px 28px;
  border-radius: 30px; font-size: 1.1rem; z-index: 5; display: none;
  border: 1px solid rgba(255,215,0,0.3); text-align: center;
}

#start-screen {
  position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
  background: radial-gradient(ellipse at center, rgba(20,10,0,0.95), rgba(0,0,0,0.98));
  z-index: 100; display: flex; flex-direction: column;
  align-items: center; justify-content: center; color: #fff;
}
#start-screen h1 {
  font-size: 2.8rem; color: #FFD700;
  text-shadow: 0 0 20px #FF6B00, 0 0 40px #FF6B00;
  margin-bottom: 1rem; letter-spacing: 0.2em;
}
#start-screen p { font-size: 1.1rem; color: #ccc; margin-bottom: 0.5rem; line-height: 1.6; }
#start-btn {
  margin-top: 2rem; padding: 1rem 3rem;
  font-size: 1.5rem; background: linear-gradient(135deg, #FF6B00, #FFD700);
  color: #000; border: none; border-radius: 50px; cursor: pointer;
  font-weight: bold; letter-spacing: 0.1em;
  box-shadow: 0 0 30px rgba(255,165,0,0.5);
  transition: transform 0.2s;
}
#start-btn:hover { transform: scale(1.08); }

#win-screen {
  position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
  background: rgba(0,0,0,0.75); z-index: 200;
  display: none; flex-direction: column; align-items: center; justify-content: center;
}
#win-msg {
  font-size: 3rem; color: #FFD700; font-weight: bold;
  text-shadow: 0 0 30px #FF6B00, 0 0 60px #FF6B00;
  animation: pulse 1s infinite alternate;
}
#win-sub { font-size: 1.3rem; color: #eee; margin: 1rem 0 2rem; }
#replay-btn {
  padding: 0.8rem 2.5rem; font-size: 1.2rem;
  background: linear-gradient(135deg, #FF6B00, #FFD700);
  color: #000; border: none; border-radius: 40px; cursor: pointer;
  font-weight: bold; box-shadow: 0 0 20px rgba(255,165,0,0.5);
}

@keyframes pulse { from { transform: scale(1); } to { transform: scale(1.06); } }
@keyframes fadeInOut { 0% { opacity: 0; } 15% { opacity: 1; } 85% { opacity: 1; } 100% { opacity: 0; } }
@keyframes caughtAnim {
  0% { opacity: 1; transform: scale(1); }
  40% { opacity: 0.7; transform: scale(1.4); }
  100% { opacity: 0; transform: scale(0.3); }
}
@keyframes sparkle {
  0% { opacity: 1; transform: translate(0,0) scale(0); }
  50% { opacity: 1; transform: scale(1.5); }
  100% { opacity: 0; transform: scale(2); }
}
</style>
</head>
<body>

<video id="video" autoplay muted playsinline></video>
<canvas id="overlay"></canvas>
<div id="hand-indicator"></div>
<div id="hand-icon">✋</div>

<div id="score-bar">
  <span>已抓：<span id="caught-count">0</span> / <span id="total-count">8</span></span>
  <span id="caught-name"></span>
</div>
<div id="hint">✊ 握拳或点击抓取脸谱 · 张手移动</div>

<div id="catch-toast">
  <div class="mask-icon" id="toast-mask-icon"></div>
  <div class="msg">恭喜您成功抓到一个<br><span class="highlight" id="toast-mask-name"></span></div>
</div>

<div id="win-screen">
  <div id="win-msg">🎉 恭喜你成功通关！</div>
  <div id="win-sub">你已集齐所有脸谱，成为脸谱大师！</div>
  <button id="replay-btn" onclick="restartGame()">再玩一次</button>
</div>

<div id="start-screen">
  <h1>🎭 脸谱大师</h1>
  <p>不同样式的京剧脸谱在屏幕中游走</p>
  <p>将手移到脸谱上方握拳即可抓取</p>
  <p>也可用鼠标点击抓取 · 集齐全部通关</p>
  <button id="start-btn" onclick="startGame()">开始游戏</button>
</div>

// ===== 肤色检测（优化版） =====
function isSkinHSV(r, g, b) {
  const max = Math.max(r, g, b), min = Math.min(r, g, b);
  const v = max / 255;
  const delta = max - min;
  if (delta < 10) return false;
  const s = delta / max;
  let h;
  if (max === r) h = ((g - b) / delta) % 6;
  else if (max === g) h = (b - r) / delta + 2;
  else h = (r - g) / delta + 4;
  h = h * 60;
  if (h < 0) h += 360;
  // 扩大范围，降低阈值让更多肤色通过
  return h >= 0 && h <= 60 && s >= 0.08 && s <= 0.9 && v >= 0.18;
}

// 形态学操作：先膨胀连接碎片，再腐蚀去除噪点
function morphClean(mask, w, h) {
  const out = new Uint8Array(w * h);
  // 膨胀3x3
  for (let y = 1; y < h - 1; y++) {
    for (let x = 1; x < w - 1; x++) {
      if (mask[y*w+x] || mask[(y-1)*w+x] || mask[(y+1)*w+x] || mask[y*w+x-1] || mask[y*w+x+1]) {
        out[y*w+x] = 1;
      }
    }
  }
  // 腐蚀3x3
  const out2 = new Uint8Array(w * h);
  for (let y = 1; y < h - 1; y++) {
    for (let x = 1; x < w - 1; x++) {
      if (out[y*w+x] && out[(y-1)*w+x] && out[(y+1)*w+x] && out[y*w+x-1] && out[y*w+x+1]) {
        out2[y*w+x] = 1;
      }
    }
  }
  return out2;
}

function detectSkinBlobs() {
  const vw = video.videoWidth, vh = video.videoHeight;
  if (vw === 0 || vh === 0) return;

  const sw = window.innerWidth, sh = window.innerHeight;
  const sampleW = 160, sampleH = 120;
  ctx.drawImage(video, 0, 0, sampleW, sampleH);
  const imgData = ctx.getImageData(0, 0, sampleW, sampleH);
  const pixels = imgData.data;

  // 肤色标记
  const skinMask = new Uint8Array(sampleW * sampleH);
  for (let i = 0; i < sampleW * sampleH; i++) {
    const r = pixels[i*4], g = pixels[i*4+1], b = pixels[i*4+2];
    if (isSkinHSV(r, g, b)) skinMask[i] = 1;
  }

  // 形态学清理
  const cleaned = morphClean(skinMask, sampleW, sampleH);

  // BFS找所有连通blob
  const visited = new Uint8Array(sampleW * sampleH);
  let blobs = [];

  for (let y = 0; y < sampleH; y++) {
    for (let x = 0; x < sampleW; x++) {
      if (cleaned[y * sampleW + x] && !visited[y * sampleW + x]) {
        let bx = 0, by = 0, bCount = 0;
        let minX = x, maxX = x, minY = y, maxY = y;
        const queue = [[x, y]];
        visited[y * sampleW + x] = 1;
        while (queue.length > 0) {
          const [cx, cy] = queue.shift();
          bx += cx; by += cy; bCount++;
          if (cx < minX) minX = cx; if (cx > maxX) maxX = cx;
          if (cy < minY) minY = cy; if (cy > maxY) maxY = cy;
          const neighbors = [[cx-1,cy],[cx+1,cy],[cx,cy-1],[cx,cy+1]];
          for (const [nx, ny] of neighbors) {
            if (nx >= 0 && nx < sampleW && ny >= 0 && ny < sampleH
                && cleaned[ny * sampleW + nx] && !visited[ny * sampleW + nx]) {
              visited[ny * sampleW + nx] = 1;
              queue.push([nx, ny]);
            }
          }
        }
        if (bCount > 30) { // 降低阈值，让手的blob更容易被检测到
          // 镜像后屏幕坐标
          const cx_screen = (1 - (bx / bCount) / sampleW) * sw;
          const cy_screen = (by / bCount) / sampleH * sh;
          // blob在视频坐标中的范围
          const vid_cx = bx / bCount;
          const vid_cy = by / bCount;
          blobs.push({
            cx: cx_screen, cy: cy_screen,
            vidCx: vid_cx / sampleW, vidCy: vid_cy / sampleH,
            vidMinX: minX / sampleW, vidMaxX: maxX / sampleW,
            vidMinY: minY / sampleH, vidMaxY: maxY / sampleH,
            area: bCount
          });
        }
      }
    }
  }

  // 按面积排序
  blobs.sort((a, b) => b.area - a.area);

  // 找脸：最大的blob，且在画面中上部区域
  let faceBlob = null;
  let handBlob = null;

  if (blobs.length >= 1) {
    faceBlob = blobs[0]; // 最大blob = 脸
    // 更新脸部位置
    const fMinX = (1 - faceBlob.vidMaxX) * sw; // 镜像
    const fMinY = faceBlob.vidMinY * sh;
    const fW = (faceBlob.vidMaxX - faceBlob.vidMinX) * sw;
    const fH = (faceBlob.vidMaxY - faceBlob.vidMinY) * sh;
    faceRegion.cx = faceBlob.cx;
    faceRegion.cy = faceBlob.cy;
    faceRegion.w = fW * 1.3;
    faceRegion.h = fH * 1.5;
    faceFound = true;

    // 找手：第二大blob，或者远离脸部中心的blob
    if (blobs.length >= 2) {
      handBlob = blobs[1];
    } else {
      // 只有一个blob（脸+手合并），尝试从blob边缘找"延伸部分"
      // 如果脸部blob面积突然大幅增大，说明手靠近了脸
      // 此时使用脸部blob的边缘点作为手的近似位置
      // 策略：找blob中距离中心最远的区域作为"手端"
      handBlob = null; // 无法分离
    }
  }

  // 更新手的检测结果
  if (handBlob) {
    rawHandPos.x = handBlob.cx;
    rawHandPos.y = handBlob.cy;
    prevBlobArea = handBlobArea;
    handBlobArea = handBlob.area;
    handVisible = true;
    handLostFrames = 0;
  } else if (faceBlob && faceBlob.area > 500 && prevBlobArea > 0) {
    // 手可能和脸合并了——用脸部边缘作为手的位置近似
    // 检查脸部blob是否突然变大（手靠近脸）
    const faceAreaDelta = faceBlob.area / (faceBlob.area - handBlobArea || faceBlob.area);
    // 用鼠标/触摸位置作为替代
    if (mouseInput.active) {
      rawHandPos.x = mouseInput.x;
      rawHandPos.y = mouseInput.y;
      handVisible = true;
      handLostFrames = 0;
    } else {
      handLostFrames++;
      if (handLostFrames > 8) {
        handVisible = false;
      }
    }
    handBlobArea = 0;
  } else {
    // 没有检测到任何blob
    if (mouseInput.active) {
      rawHandPos.x = mouseInput.x;
      rawHandPos.y = mouseInput.y;
      handVisible = true;
      handLostFrames = 0;
      handBlobArea = 0;
    } else {
      handLostFrames++;
      if (handLostFrames > 5) {
        handVisible = false;
        handBlobArea = 0;
      }
    }
  }

  // ===== 平滑手位置（关键：避免跳跃和贴边缘） =====
  const SMOOTH_FACTOR = 0.35; // 平滑系数（0=全平滑不动，1=无平滑全靠原始值）
  if (handVisible) {
    if (smoothHandPos.x < 0) {
      // 首次检测，直接赋值
      smoothHandPos.x = rawHandPos.x;
      smoothHandPos.y = rawHandPos.y;
    } else {
      smoothHandPos.x += (rawHandPos.x - smoothHandPos.x) * SMOOTH_FACTOR;
      smoothHandPos.y += (rawHandPos.y - smoothHandPos.y) * SMOOTH_FACTOR;
    }
    // 约束在屏幕范围内
    smoothHandPos.x = Math.max(20, Math.min(sw - 20, smoothHandPos.x));
    smoothHandPos.y = Math.max(20, Math.min(sh - 20, smoothHandPos.y));
  }
}

// ===== 判断握拳（改进版） =====
let recentMaxArea = 0;
let areaHistory = [];
const AREA_HISTORY_LEN = 20;
const GRAB_THRESHOLD = 0.50;

function detectGrabGesture() {
  if (!handVisible) {
    isGrabbing = false;
    return;
  }

  // 鼠标/触摸的点击 = 立即抓取
  if (mouseInput.down && mouseInput.active) {
    isGrabbing = true;
    return;
  }

  // 肤色检测的握拳：面积变化法
  if (handBlobArea > 0) {
    areaHistory.push(handBlobArea);
    if (areaHistory.length > AREA_HISTORY_LEN) areaHistory.shift();
    recentMaxArea = Math.max(...areaHistory);
    if (recentMaxArea > 20 && handBlobArea < recentMaxArea * GRAB_THRESHOLD) {
      isGrabbing = true;
    } else {
      isGrabbing = false;
    }
  } else {
    // 没有肤色面积数据时，无法判断握拳
    isGrabbing = false;
  }
}

// ===== 脸谱对象 =====
class MaskObj {
  constructor(data, idx) {
    this.data = data;
    this.idx = idx;
    this.size = 90 + Math.random() * 50;
    this.x = Math.random() * (window.innerWidth - this.size);
    this.y = Math.random() * (window.innerHeight - this.size);
    this.vx = (Math.random() - 0.5) * 2.5;
    this.vy = (Math.random() - 0.5) * 2.5;
    this.angle = Math.random() * 360;
    this.angleV = (Math.random() - 0.5) * 1.5;
    this.caught = false;
    this.catching = false;
  }

  update() {
    if (this.caught || this.catching) return;
    this.x += this.vx;
    this.y += this.vy;
    this.angle += this.angleV;
    const sw = window.innerWidth, sh = window.innerHeight;
    if (this.x < 0 || this.x + this.size > sw) { this.vx *= -1; this.x = Math.max(0, Math.min(sw - this.size, this.x)); }
    if (this.y < 0 || this.y + this.size > sh) { this.vy *= -1; this.y = Math.max(0, Math.min(sh - this.size, this.y)); }
  }

  draw(ctx) {
    if (this.caught) return;
    ctx.save();
    ctx.translate(this.x + this.size/2, this.y + this.size/2);
    ctx.rotate(this.angle * Math.PI / 180);
    ctx.globalAlpha = this.catching ? 0.5 : 1;
    // 绘制SVG到临时canvas再画到主canvas
    drawSVGToCtx(ctx, this.data.svg, -this.size/2, -this.size/2, this.size, this.size);
    ctx.restore();
  }

  get cx() { return this.x + this.size / 2; }
  get cy() { return this.y + this.size / 2; }

  hitTest(px, py) {
    const dx = px - this.cx, dy = py - this.cy;
    return Math.sqrt(dx*dx + dy*dy) < this.size * 0.6;
  }
}

// SVG绘制缓存
const svgCache = {};
function drawSVGToCtx(ctx, svgStr, x, y, w, h) {
  if (!svgCache[svgStr]) {
    const img = new Image();
    const blob = new Blob([svgStr], { type: 'image/svg+xml;charset=utf-8' });
    svgCache[svgStr] = { img, loaded: false, url: URL.createObjectURL(blob) };
    img.onload = () => { svgCache[svgStr].loaded = true; };
    img.src = svgCache[svgStr].url;
  }
  const cached = svgCache[svgStr];
  if (cached.loaded) {
    ctx.drawImage(cached.img, x, y, w, h);
  } else {
    // SVG还没加载，画一个占位色块
    ctx.fillStyle = MASKS.find(m => m.svg === svgStr)?.color || '#888';
    ctx.fillRect(x, y, w, h);
    ctx.fillStyle = '#fff';
    ctx.font = `${Math.max(12, w * 0.15)}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(MASKS.find(m => m.svg === svgStr)?.name || '?', x + w/2, y + h/2);
  }
}

// ===== 抓取特效 =====
function spawnSparkles(cx, cy) {
  for (let i = 0; i < 10; i++) {
    const el = document.createElement('div');
    const colors = ['#FFD700','#FF6B00','#FF4444','#00FF88','#FF69B4'];
    el.style.cssText = `
      position:fixed; left:${cx}px; top:${cy}px;
      width:12px; height:12px;
      background:${colors[i%5]}; border-radius:50%;
      pointer-events:none; z-index:15;
      animation: sparkle 0.6s forwards;
      transform: translate(${(Math.random()-0.5)*80}px, ${(Math.random()-0.5)*80}px);
    `;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 700);
  }
}

// ===== 抓取脸谱 =====
let grabCooldown = 0;
function tryGrab() {
  if (!handVisible || !isGrabbing || wasGrabbing) return;
  if (grabCooldown > 0) return;

  const hx = smoothHandPos.x, hy = smoothHandPos.y;
  for (const m of maskObjs) {
    if (!m.caught && !m.catching && m.hitTest(hx, hy)) {
      m.catching = true;
      spawnSparkles(m.cx, m.cy);
      grabCooldown = 15; // 15帧冷却防止连续抓取
      setTimeout(() => {
        m.caught = true;
        m.catching = false;
        caughtCount++;
        caughtMasks.push(m.data);
        updateUI();
        showCatchToast(m.data);
        if (caughtCount >= TOTAL) {
          setTimeout(showWin, 1500);
        }
      }, 400);
      break;
    }
  }
}

function showCatchToast(maskData) {
  const toast = document.getElementById('catch-toast');
  const iconEl = document.getElementById('toast-mask-icon');
  const nameEl = document.getElementById('toast-mask-name');

  // 显示脸谱缩略图
  iconEl.innerHTML = maskData.svg;
  nameEl.textContent = maskData.name;

  toast.classList.add('show');
  toast.style.display = 'flex';

  // 2.5秒后隐藏
  setTimeout(() => {
    toast.classList.remove('show');
    setTimeout(() => { toast.style.display = 'none'; }, 350);
  }, 2500);
}

function updateUI() {
  document.getElementById('caught-count').textContent = caughtCount;
  document.getElementById('total-count').textContent = TOTAL;
}

function showWin() {
  gameWon = true;
  const winMsg = document.getElementById('win-msg');
  winMsg.textContent = '🎉 恭喜你成功通关！';
  document.getElementById('win-screen').style.display = 'flex';
}

// ===== 绘制已抓脸谱列表（右侧小图标） =====
function drawCaughtIcons(ctx) {
  const iconSize = 40;
  const startX = window.innerWidth - 50;
  for (let i = 0; i < caughtMasks.length; i++) {
    const y = 80 + i * (iconSize + 8);
    ctx.save();
    ctx.globalAlpha = 0.9;
    drawSVGToCtx(ctx, caughtMasks[i].svg, startX - iconSize, y, iconSize, iconSize);
    ctx.restore();
  }
}

// ===== 主循环 =====
let frameCount = 0;
function gameLoop() {
  if (!gameRunning) return;

  const sw = window.innerWidth, sh = window.innerHeight;
  ctx.clearRect(0, 0, sw, sh);

  // 每帧都检测肤色（提高灵敏度）
  detectSkinBlobs();
  detectGrabGesture();

  // 冷却倒计时
  if (grabCooldown > 0) grabCooldown--;

  // 更新脸谱
  for (const m of maskObjs) m.update();

  // 绘制脸谱
  for (const m of maskObjs) m.draw(ctx);

  // 绘制已抓脸谱小图标
  drawCaughtIcons(ctx);

  // 更新手指示符（使用平滑位置）
  if (handVisible && smoothHandPos.x > 0) {
    handIndicator.style.display = 'block';
    handIndicator.style.left = smoothHandPos.x + 'px';
    handIndicator.style.top = smoothHandPos.y + 'px';
    handIndicator.className = isGrabbing ? 'grabbing' : '';
    handIcon.style.display = 'block';
    handIcon.style.left = smoothHandPos.x + 'px';
    handIcon.style.top = smoothHandPos.y + 'px';
    handIcon.textContent = isGrabbing ? '✊' : '✋';
    handIcon.style.color = isGrabbing ? '#FF4444' : '#FFD700';
  } else {
    handIndicator.style.display = 'none';
    handIcon.style.display = 'none';
  }

  // 尝试抓取
  tryGrab();
  wasGrabbing = isGrabbing;

  frameCount++;
  requestAnimationFrame(gameLoop);
}

// ===== 启动游戏 =====
async function startGame() {
  document.getElementById('start-screen').style.display = 'none';
  const ok = await initCamera();
  if (!ok) { document.getElementById('start-screen').style.display = 'flex'; return; }

  await new Promise(r => {
    if (video.readyState >= 2) r();
    else video.onloadeddata = r;
  });

  document.getElementById('score-bar').style.display = 'flex';
  document.getElementById('hint').style.display = 'block';
  updateUI();

  maskObjs = MASKS.map((m, i) => new MaskObj(m, i));
  gameRunning = true;
  caughtCount = 0;
  gameWon = false;
  caughtMasks = [];
  frameCount = 0;
  areaHistory = [];
  recentMaxArea = 0;
  handBlobArea = 0;
  prevBlobArea = 0;
  smoothHandPos = { x: -1, y: -1 };
  rawHandPos = { x: -1, y: -1 };
  handVisible = false;
  handLostFrames = 0;
  isGrabbing = false;
  wasGrabbing = false;
  grabCooldown = 0;

  // 预加载SVG图片
  MASKS.forEach(m => drawSVGToCtx(ctx, m.svg, 0, 0, 1, 1));

  gameLoop();
  setTimeout(() => { document.getElementById('hint').style.display = 'none'; }, 5000);
}

function restartGame() {
  gameWon = false;
  caughtCount = 0;
  caughtMasks = [];
  gameRunning = false;
  maskObjs = [];

  document.getElementById('win-screen').style.display = 'none';
  areaHistory = [];
  recentMaxArea = 0;
  handBlobArea = 0;
  smoothHandPos = { x: -1, y: -1 };
  rawHandPos = { x: -1, y: -1 };
  handVisible = false;
  handLostFrames = 0;
  isGrabbing = false;
  wasGrabbing = false;
  grabCooldown = 0;

  maskObjs = MASKS.map((m, i) => new MaskObj(m, i));
  updateUI();

  gameRunning = true;
  gameWon = false;
  gameLoop();

  setTimeout(() => {
    document.getElementById('hint').style.display = 'block';
    setTimeout(() => { document.getElementById('hint').style.display = 'none'; }, 5000);
  }, 200);
}
</script>
