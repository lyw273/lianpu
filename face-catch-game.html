<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>脸谱大师 - 手势抓取游戏</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: "PingFang SC","Microsoft YaHei",sans-serif; }

#video { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; transform: scaleX(-1); z-index: 0; }

#overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 2; pointer-events: none; }

#hand-indicator {
  position: fixed; z-index: 8; pointer-events: none; display: none;
  width: 60px; height: 60px;
  border-radius: 50%; border: 3px solid #FFD700;
  background: rgba(255,215,0,0.15);
  transition: border-color 0.15s, background 0.15s, transform 0.15s;
  transform: translate(-50%, -50%);
}
#hand-indicator.grabbing {
  border-color: #FF4444; background: rgba(255,68,68,0.25);
  transform: translate(-50%, -50%) scale(1.2);
}
#hand-icon {
  position: fixed; z-index: 9; pointer-events: none; display: none;
  font-size: 2rem; transform: translate(-50%, -50%);
  filter: drop-shadow(0 2px 8px rgba(0,0,0,0.9));
  user-select: none;
}

#catch-toast {
  position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(20px);
  background: rgba(0,0,0,0.85); border: 2px solid #FFD700;
  border-radius: 20px; padding: 16px 32px;
  color: #FFD700; font-size: 1.3rem; z-index: 20;
  display: none; align-items: center; gap: 16px;
  box-shadow: 0 0 30px rgba(255,215,0,0.4);
  opacity: 0; transition: opacity 0.3s, transform 0.3s;
}
#catch-toast.show { display: flex; opacity: 1; transform: translateX(-50%) translateY(0); }
#catch-toast .mask-icon { width: 60px; height: 60px; }
#catch-toast .msg { line-height: 1.5; }
#catch-toast .msg .highlight { color: #FF6B00; font-weight: bold; font-size: 1.5rem; }

#score-bar {
  position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
  background: rgba(0,0,0,0.7); border: 2px solid #FFD700;
  border-radius: 40px; padding: 8px 30px;
  color: #FFD700; font-size: 1.2rem; z-index: 5;
  display: none; align-items: center; gap: 20px;
}
#caught-name {
  color: #FF6B00; font-size: 1rem; display: none;
}

#hint {
  position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
  background: rgba(0,0,0,0.7); color: #FFD700; padding: 12px 28px;
  border-radius: 30px; font-size: 1.1rem; z-index: 5; display: none;
  border: 1px solid rgba(255,215,0,0.3); text-align: center;
}

#start-screen {
  position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
  background: radial-gradient(ellipse at center, rgba(20,10,0,0.95), rgba(0,0,0,0.98));
  z-index: 100; display: flex; flex-direction: column;
  align-items: center; justify-content: center; color: #fff;
}
#start-screen h1 {
  font-size: 2.8rem; color: #FFD700;
  text-shadow: 0 0 20px #FF6B00, 0 0 40px #FF6B00;
  margin-bottom: 1rem; letter-spacing: 0.2em;
}
#start-screen p { font-size: 1.1rem; color: #ccc; margin-bottom: 0.5rem; line-height: 1.6; }
#start-btn {
  margin-top: 2rem; padding: 1rem 3rem;
  font-size: 1.5rem; background: linear-gradient(135deg, #FF6B00, #FFD700);
  color: #000; border: none; border-radius: 50px; cursor: pointer;
  font-weight: bold; letter-spacing: 0.1em;
  box-shadow: 0 0 30px rgba(255,165,0,0.5);
  transition: transform 0.2s;
}
#start-btn:hover { transform: scale(1.08); }

#win-screen {
  position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
  background: rgba(0,0,0,0.75); z-index: 200;
  display: none; flex-direction: column; align-items: center; justify-content: center;
}
#win-msg {
  font-size: 3rem; color: #FFD700; font-weight: bold;
  text-shadow: 0 0 30px #FF6B00, 0 0 60px #FF6B00;
  animation: pulse 1s infinite alternate;
}
#win-sub { font-size: 1.3rem; color: #eee; margin: 1rem 0 2rem; }
#replay-btn {
  padding: 0.8rem 2.5rem; font-size: 1.2rem;
  background: linear-gradient(135deg, #FF6B00, #FFD700);
  color: #000; border: none; border-radius: 40px; cursor: pointer;
  font-weight: bold; box-shadow: 0 0 20px rgba(255,165,0,0.5);
}

#camera-error {
  position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
  background: rgba(0,0,0,0.92); z-index: 300;
  display: none; flex-direction: column;
  align-items: center; justify-content: center;
  color: #fff; padding: 2rem; text-align: center;
}
#camera-error .err-title { font-size: 1.8rem; color: #FF4444; margin-bottom: 1rem; }
#camera-error .err-msg {
  font-size: 1rem; color: #ccc; max-width: 500px;
  line-height: 1.7; margin-bottom: 2rem;
  background: rgba(255,255,255,0.05); border-radius: 12px;
  padding: 1rem 1.5rem; border: 1px solid rgba(255,68,68,0.3);
}
#camera-error .err-btns { display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center; }
#camera-error .btn-retry {
  padding: 0.8rem 2rem; font-size: 1.1rem;
  background: linear-gradient(135deg, #FF6B00, #FFD700);
  color: #000; border: none; border-radius: 40px; cursor: pointer; font-weight: bold;
}
#camera-error .btn-skip {
  padding: 0.8rem 2rem; font-size: 1.1rem;
  background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3);
  color: #fff; border-radius: 40px; cursor: pointer;
}


@keyframes fadeInOut { 0% { opacity: 0; } 15% { opacity: 1; } 85% { opacity: 1; } 100% { opacity: 0; } }
@keyframes caughtAnim {
  0% { opacity: 1; transform: scale(1); }
  40% { opacity: 0.7; transform: scale(1.4); }
  100% { opacity: 0; transform: scale(0.3); }
}
@keyframes sparkle {
  0% { opacity: 1; transform: translate(0,0) scale(0); }
  50% { opacity: 1; transform: scale(1.5); }
  100% { opacity: 0; transform: scale(2); }
}
</style>
</head>
<body>

<video id="video" autoplay muted playsinline></video>
<canvas id="overlay"></canvas>
<div id="hand-indicator"></div>
<div id="hand-icon">✋</div>

<div id="score-bar">
  <span>已抓：<span id="caught-count">0</span> / <span id="total-count">8</span></span>
  <span id="caught-name"></span>
</div>
<div id="hint">✊ 握拳或点击抓取脸谱 · 张手移动</div>

<div id="catch-toast">
  <div class="mask-icon" id="toast-mask-icon"></div>
  <div class="msg">恭喜您成功抓到一个<br><span class="highlight" id="toast-mask-name"></span></div>
</div>

<div id="camera-error">
  <div class="err-title">📷 摄像头无法启动</div>
  <div class="err-msg"></div>
  <div class="err-btns">
    <button class="btn-retry" onclick="retryCamera()">🔄 重新授权摄像头</button>
    <button class="btn-skip" onclick="startWithoutCamera()">🖱️ 改用鼠标操控</button>
  </div>
</div>

<div id="win-screen">
  <div id="win-msg">🎉 恭喜你成功通关！</div>
  <div id="win-sub">你已集齐所有脸谱，成为脸谱大师！</div>
  <button id="replay-btn" onclick="restartGame()">再玩一次</button>
</div>

<div id="start-screen">
  <h1>🎭 脸谱大师</h1>
  <p>不同样式的京剧脸谱在屏幕中游走</p>
  <p>将手移到脸谱上方握拳即可抓取</p>
  <p>也可用鼠标点击抓取 · 集齐全部通关</p>
  <button id="start-btn" onclick="startGame()">开始游戏</button>
</div>

// ===== 摄像头 =====
async function initCamera() {
  // 检测是否支持getUserMedia
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    showCameraError('您的浏览器不支持摄像头功能，请使用 Chrome 或 Edge 浏览器。');
    return false;
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } }
    });
    video.srcObject = stream;
    await video.play();
    return true;
  } catch(e) {
    let msg = '无法获取摄像头';
    if (e.name === 'NotAllowedError' || e.name === 'PermissionDeniedError') {
      msg = '❌ 摄像头权限被拒绝\n\n请在浏览器地址栏左侧点击🔒图标，将摄像头权限改为"允许"，然后刷新页面重试。';
    } else if (e.name === 'NotFoundError') {
      msg = '❌ 未找到摄像头设备\n\n请确认您的设备有摄像头，并且摄像头未被其他程序占用。';
    } else if (e.name === 'NotReadableError') {
      msg = '❌ 摄像头被占用\n\n请关闭其他使用摄像头的程序（如腾讯会议、Zoom等），然后重试。';
    } else {
      msg = '❌ 摄像头错误：' + e.message + '\n\n游戏将切换为鼠标/触摸操控模式。';
    }
    showCameraError(msg);
    return false;
  }
}

function showCameraError(msg) {
  const el = document.getElementById('camera-error');
  el.style.display = 'flex';
  el.querySelector('.err-msg').textContent = msg.replace(/\n\n/g, '\n').replace(/\n/g, ' ');
}

}

function retryCamera() {

}

// ===== 肤色检测（优化版） =====
function isSkinHSV(r, g, b) {
  const max = Math.max(r, g, b), min = Math.min(r, g, b);
  const v = max / 255;
  const delta = max - min;
  if (delta < 10) return false;
  const s = delta / max;
  let h;
  if (max === r) h = ((g - b) / delta) % 6;
  else if (max === g) h = (b - r) / delta + 2;
  else h = (r - g) / delta + 4;
  h = h * 60;
  if (h < 0) h += 360;
  return h >= 0 && h <= 65 && s >= 0.07 && s <= 0.92 && v >= 0.15;
}

// 形态学操作：膨胀+腐蚀
function morphClean(mask, w, h) {
  const out = new Uint8Array(w * h);
  for (let y = 1; y < h - 1; y++) {
    for (let x = 1; x < w - 1; x++) {
      if (mask[y*w+x] || mask[(y-1)*w+x] || mask[(y+1)*w+x] || mask[y*w+x-1] || mask[y*w+x+1]) {
        out[y*w+x] = 1;
      }
    }
  }
  const out2 = new Uint8Array(w * h);
  for (let y = 1; y < h - 1; y++) {
    for (let x = 1; x < w - 1; x++) {
      if (out[y*w+x] && out[(y-1)*w+x] && out[(y+1)*w+x] && out[y*w+x-1] && out[y*w+x+1]) {
        out2[y*w+x] = 1;
      }
    }
  }
  return out2;
}

// 创建新的手点对象
function makeHandPoint() {
  return {
    rawX: -1, rawY: -1,
    smoothX: -1, smoothY: -1,
    area: 0, prevArea: 0,
    visible: false, lostFrames: 0,
    grabbing: false, wasGrabbing: false,
    areaHistory: [], maxArea: 0,
    cooldown: 0
  };
}

// ===== 多点手掌检测（双手支持） =====
function detectSkinBlobs() {
  const vw = video.videoWidth, vh = video.videoHeight;
  if (vw === 0 || vh === 0) return;

  const sw = window.innerWidth, sh = window.innerHeight;
  const DW = 160, DH = 120;

  // 用独立检测画布，不污染游戏画布
  detCtx.drawImage(video, 0, 0, DW, DH);
  const imgData = detCtx.getImageData(0, 0, DW, DH);
  const pixels = imgData.data;

  // 肤色标记
  const skinMask = new Uint8Array(DW * DH);
  for (let i = 0; i < DW * DH; i++) {
    const r = pixels[i*4], g = pixels[i*4+1], b = pixels[i*4+2];
    if (isSkinHSV(r, g, b)) skinMask[i] = 1;
  }

  // 形态学清理
  const cleaned = morphClean(skinMask, DW, DH);

  // BFS找所有连通blob
  const visited = new Uint8Array(DW * DH);
  let blobs = [];

  for (let y = 0; y < DH; y++) {
    for (let x = 0; x < DW; x++) {
      if (cleaned[y * DW + x] && !visited[y * DW + x]) {
        let bx = 0, by = 0, bCount = 0;
        const queue = [y * DW + x];
        visited[y * DW + x] = 1;
        let head = 0;
        while (head < queue.length) {
          const idx = queue[head++];
          const qx = idx % DW, qy = Math.floor(idx / DW);
          bx += qx; by += qy; bCount++;
          const ns = [idx-1, idx+1, idx-DW, idx+DW];
          for (const ni of ns) {
            const nx = ni % DW, ny = Math.floor(ni / DW);
            if (ni >= 0 && ni < DW*DH && nx >= 0 && nx < DW && !visited[ni] && cleaned[ni]) {
              visited[ni] = 1;
              queue.push(ni);
            }
          }
        }
        if (bCount > 25) {
          // 注意：视频是镜像的，x坐标需要翻转
          const normX = 1 - (bx / bCount) / DW; // 镜像翻转
          const normY = (by / bCount) / DH;
          blobs.push({
            cx: normX * sw,
            cy: normY * sh,
            normX, normY,
            area: bCount
          });
        }
      }
    }
  }

  // 按面积排序
  blobs.sort((a, b) => b.area - a.area);

  // ===== 将blob分配给手点 =====
  // 最大的blob通常是脸，跳过；取后面的blob作为手
  // 但也有可能：脸被遮住，所有blob都是手
  // 策略：取最多 MAX_HANDS 个 blob，且面积不能太小（避免误检）

  // 先判断哪些blob像"手"：
  // - 面积在合理范围内
  // - 排除最大的blob（脸），除非所有blob面积都差不多
  let handBlobs = [];
  const MIN_HAND_AREA = 30;
  const MAX_HAND_AREA = 2000;

  if (blobs.length === 0) {
    handBlobs = [];
  } else if (blobs.length === 1) {
    // 只有1个blob，可能是脸，也可能是手
    // 如果在屏幕下半部分或边缘，更可能是手
    const b = blobs[0];
    if (b.normY > 0.4 || b.normX < 0.15 || b.normX > 0.85) {
      handBlobs = [b]; // 位置偏下/边缘，当手处理
    } else {
      handBlobs = []; // 中上部，当脸处理，手不可见
    }
  } else {
    // 多个blob：
    // 最大的通常是脸（排除），剩余的是手
    // 但如果第二大/第三大面积比第一大小很多，它们是手
    const faceBlob = blobs[0];
    const rest = blobs.slice(1).filter(b => b.area >= MIN_HAND_AREA && b.area <= MAX_HAND_AREA);
    handBlobs = rest.slice(0, MAX_HANDS);

    // 如果rest为空（所有blob都太大），退化用边缘blob
    if (handBlobs.length === 0 && blobs.length >= 2) {
      handBlobs = blobs.slice(1, 1 + MAX_HANDS);
    }
  }

  // ===== 更新handPoints（稳定追踪，避免闪烁） =====
  // 保证handPoints数组长度 = MAX_HANDS
  while (handPoints.length < MAX_HANDS) handPoints.push(makeHandPoint());

  // 匹配：把检测到的blob匹配到最近的handPoint
  const used = new Array(MAX_HANDS).fill(false);
  const assigned = new Array(handBlobs.length).fill(-1);

  // 贪心最近距离匹配
  for (let bi = 0; bi < handBlobs.length; bi++) {
    let bestDist = Infinity, bestHi = -1;
    for (let hi = 0; hi < MAX_HANDS; hi++) {
      if (used[hi]) continue;
      const hp = handPoints[hi];
      if (!hp.visible) { // 空闲slot优先
        if (bestHi === -1 || hp.visible === false) {
          bestDist = 0; bestHi = hi;
        }
      } else {
        const dx = handBlobs[bi].cx - hp.smoothX;
        const dy = handBlobs[bi].cy - hp.smoothY;
        const d = Math.sqrt(dx*dx + dy*dy);
        if (d < bestDist) { bestDist = d; bestHi = hi; }
      }
    }
    if (bestHi !== -1) { used[bestHi] = true; assigned[bi] = bestHi; }
  }

  // 更新匹配到的handPoints
  for (let bi = 0; bi < handBlobs.length; bi++) {
    const hi = assigned[bi];
    if (hi === -1) continue;
    const hp = handPoints[hi];
    const blob = handBlobs[bi];
    hp.prevArea = hp.area;
    hp.area = blob.area;
    hp.rawX = blob.cx;
    hp.rawY = blob.cy;
    hp.visible = true;
    hp.lostFrames = 0;

    // 平滑
    const SMOOTH = 0.4;
    if (hp.smoothX < 0) { hp.smoothX = hp.rawX; hp.smoothY = hp.rawY; }
    else {
      hp.smoothX += (hp.rawX - hp.smoothX) * SMOOTH;
      hp.smoothY += (hp.rawY - hp.smoothY) * SMOOTH;
    }
    // 约束屏幕范围
    hp.smoothX = Math.max(0, Math.min(sw, hp.smoothX));
    hp.smoothY = Math.max(0, Math.min(sh, hp.smoothY));
  }

  // 更新未匹配的handPoints（逐渐消失）
  for (let hi = 0; hi < MAX_HANDS; hi++) {
    if (used[hi]) continue;
    const hp = handPoints[hi];
    hp.lostFrames++;
    if (hp.lostFrames > 8) {
      hp.visible = false;
      hp.smoothX = -1; hp.smoothY = -1;
      hp.area = 0; hp.prevArea = 0;
      hp.areaHistory = []; hp.maxArea = 0;
    }
  }

  // ===== 鼠标/触摸补充 =====
  // 鼠标补充到第一个不可见的slot
  if (mouseInput.active) {
    let slot = handPoints.find(hp => !hp.visible);
    // 或者如果鼠标按下，临时激活鼠标点
    if (mouseInput.down) {
      // 找没有被camera占用的slot
      if (!slot) slot = handPoints[MAX_HANDS - 1]; // 用最后一个slot
      slot.rawX = mouseInput.x;
      slot.rawY = mouseInput.y;
      slot.smoothX = mouseInput.x;
      slot.smoothY = mouseInput.y;
      slot.visible = true;
      slot.lostFrames = 0;
      slot.area = 100; // 假设一个面积
    }
  }

  // 多点触摸：每个触摸点对应一个hand slot
  if (touchPoints.length > 0) {
    for (let ti = 0; ti < Math.min(touchPoints.length, MAX_HANDS); ti++) {
      const tp = touchPoints[ti];
      const hp = handPoints[ti];
      hp.rawX = tp.x; hp.rawY = tp.y;
      hp.smoothX = tp.x; hp.smoothY = tp.y;
      hp.visible = true; hp.lostFrames = 0;
      hp.area = 100;
    }
  }
}

// ===== 判断握拳（每个手点独立判断） =====
const GRAB_THRESHOLD = 0.50;
const AREA_HISTORY_LEN = 18;

function detectGrabGesture() {
  for (const hp of handPoints) {
    hp.wasGrabbing = hp.grabbing;

    if (!hp.visible) { hp.grabbing = false; continue; }

    // 肤色握拳检测：面积缩小到历史最大的50%以下
    if (hp.area > 0) {
      hp.areaHistory.push(hp.area);
      if (hp.areaHistory.length > AREA_HISTORY_LEN) hp.areaHistory.shift();
      hp.maxArea = Math.max(...hp.areaHistory);
      if (hp.maxArea > 20 && hp.area < hp.maxArea * GRAB_THRESHOLD) {
        hp.grabbing = true;
      } else {
        hp.grabbing = false;
      }
    } else {
      hp.grabbing = false;
    }
  }

  // 鼠标按下=第一个激活slot的grabbing
  if (mouseInput.down && mouseInput.active) {
    const slot = handPoints.find(hp => hp.visible);
    if (slot) slot.grabbing = true;
  }
}

// ===== 脸谱对象 =====
class MaskObj {
  constructor(data, idx) {
    this.data = data;
    this.idx = idx;
    this.size = 90 + Math.random() * 50;
    this.x = Math.random() * (window.innerWidth - this.size);
    this.y = Math.random() * (window.innerHeight - this.size);
    this.vx = (Math.random() - 0.5) * 2.5;
    this.vy = (Math.random() - 0.5) * 2.5;
    this.angle = Math.random() * 360;
    this.angleV = (Math.random() - 0.5) * 1.5;
    this.caught = false;
    this.catching = false;
  }

  update() {
    if (this.caught || this.catching) return;
    this.x += this.vx;
    this.y += this.vy;
    this.angle += this.angleV;
    const sw = window.innerWidth, sh = window.innerHeight;
    if (this.x < 0 || this.x + this.size > sw) { this.vx *= -1; this.x = Math.max(0, Math.min(sw - this.size, this.x)); }
    if (this.y < 0 || this.y + this.size > sh) { this.vy *= -1; this.y = Math.max(0, Math.min(sh - this.size, this.y)); }
  }

  draw(ctx) {
    if (this.caught) return;
    ctx.save();
    ctx.translate(this.x + this.size/2, this.y + this.size/2);
    ctx.rotate(this.angle * Math.PI / 180);
    ctx.globalAlpha = this.catching ? 0.5 : 1;
    // 绘制SVG到临时canvas再画到主canvas
    drawSVGToCtx(ctx, this.data.svg, -this.size/2, -this.size/2, this.size, this.size);
    ctx.restore();
  }

  get cx() { return this.x + this.size / 2; }
  get cy() { return this.y + this.size / 2; }

  hitTest(px, py) {
    const dx = px - this.cx, dy = py - this.cy;
    return Math.sqrt(dx*dx + dy*dy) < this.size * 0.6;
  }
}

// SVG绘制缓存
const svgCache = {};
function drawSVGToCtx(ctx, svgStr, x, y, w, h) {
  if (!svgCache[svgStr]) {
    const img = new Image();
    const blob = new Blob([svgStr], { type: 'image/svg+xml;charset=utf-8' });
    svgCache[svgStr] = { img, loaded: false, url: URL.createObjectURL(blob) };
    img.onload = () => { svgCache[svgStr].loaded = true; };
    img.src = svgCache[svgStr].url;
  }
  const cached = svgCache[svgStr];
  if (cached.loaded) {
    ctx.drawImage(cached.img, x, y, w, h);
  } else {
    // SVG还没加载，画一个占位色块
    ctx.fillStyle = MASKS.find(m => m.svg === svgStr)?.color || '#888';
    ctx.fillRect(x, y, w, h);
    ctx.fillStyle = '#fff';
    ctx.font = `${Math.max(12, w * 0.15)}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(MASKS.find(m => m.svg === svgStr)?.name || '?', x + w/2, y + h/2);
  }
}

// ===== 抓取特效 =====
function spawnSparkles(cx, cy) {
  for (let i = 0; i < 10; i++) {
    const el = document.createElement('div');
    const colors = ['#FFD700','#FF6B00','#FF4444','#00FF88','#FF69B4'];
    el.style.cssText = `
      position:fixed; left:${cx}px; top:${cy}px;
      width:12px; height:12px;
      background:${colors[i%5]}; border-radius:50%;
      pointer-events:none; z-index:15;
      animation: sparkle 0.6s forwards;
      transform: translate(${(Math.random()-0.5)*80}px, ${(Math.random()-0.5)*80}px);
    `;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 700);
  }
}

// ===== 抓取脸谱（多手点支持） =====
let grabCooldownGlobal = 0;
function tryGrab() {
  if (grabCooldownGlobal > 0) { grabCooldownGlobal--; return; }

  for (const hp of handPoints) {
    if (!hp.visible || !hp.grabbing || hp.wasGrabbing) continue;
    if (hp.cooldown > 0) { hp.cooldown--; continue; }

    const hx = hp.smoothX, hy = hp.smoothY;
    for (const m of maskObjs) {
      if (!m.caught && !m.catching && m.hitTest(hx, hy)) {
        m.catching = true;
        spawnSparkles(m.cx, m.cy);
        hp.cooldown = 20; // 该手点冷却20帧
        grabCooldownGlobal = 10;
        setTimeout(() => {
          m.caught = true;
          m.catching = false;
          caughtCount++;
          caughtMasks.push(m.data);
          updateUI();
          showCatchToast(m.data);
          if (caughtCount >= TOTAL) {
            setTimeout(showWin, 1500);
          }
        }, 400);
        break;
      }
    }
  }

  // 鼠标单击抓取
  if (mouseInput.down && !mouseInput.wasDown) {
    mouseInput.wasDown = true;
    const hx = mouseInput.x, hy = mouseInput.y;
    for (const m of maskObjs) {
      if (!m.caught && !m.catching && m.hitTest(hx, hy)) {
        m.catching = true;
        spawnSparkles(m.cx, m.cy);
        setTimeout(() => {
          m.caught = true; m.catching = false;
          caughtCount++; caughtMasks.push(m.data);
          updateUI(); showCatchToast(m.data);
          if (caughtCount >= TOTAL) setTimeout(showWin, 1500);
        }, 400);
        break;
      }
    }
  }
  if (!mouseInput.down) mouseInput.wasDown = false;
}

function showCatchToast(maskData) {
  const toast = document.getElementById('catch-toast');
  const iconEl = document.getElementById('toast-mask-icon');
  const nameEl = document.getElementById('toast-mask-name');

  // 显示脸谱缩略图
  iconEl.innerHTML = maskData.svg;
  nameEl.textContent = maskData.name;

  toast.classList.add('show');
  toast.style.display = 'flex';

  // 2.5秒后隐藏
  setTimeout(() => {
    toast.classList.remove('show');
    setTimeout(() => { toast.style.display = 'none'; }, 350);
  }, 2500);
}

function updateUI() {
  document.getElementById('caught-count').textContent = caughtCount;
  document.getElementById('total-count').textContent = TOTAL;
}

function showWin() {
  gameWon = true;
  const winMsg = document.getElementById('win-msg');
  winMsg.textContent = '🎉 恭喜你成功通关！';
  document.getElementById('win-screen').style.display = 'flex';
}

// ===== 绘制已抓脸谱列表（右侧小图标） =====
function drawCaughtIcons(ctx) {
  const iconSize = 40;
  const startX = window.innerWidth - 50;
  for (let i = 0; i < caughtMasks.length; i++) {
    const y = 80 + i * (iconSize + 8);
    ctx.save();
    ctx.globalAlpha = 0.9;
    drawSVGToCtx(ctx, caughtMasks[i].svg, startX - iconSize, y, iconSize, iconSize);
    ctx.restore();
  }
}

// ===== 主循环 =====
let frameCount = 0;
// 多手指示符（复用/创建）
const handIndicators = [];
function getHandIndicator(i) {
  while (handIndicators.length <= i) {
    const el = document.createElement('div');
    el.style.cssText = `position:fixed;z-index:8;pointer-events:none;display:none;
      width:60px;height:60px;border-radius:50%;border:3px solid #FFD700;
      background:rgba(255,215,0,0.15);transform:translate(-50%,-50%);
      transition:border-color 0.1s,background 0.1s;`;
    const icon = document.createElement('div');
    icon.style.cssText = `position:fixed;z-index:9;pointer-events:none;display:none;
      font-size:2rem;transform:translate(-50%,-50%);
      filter:drop-shadow(0 2px 8px rgba(0,0,0,0.9));user-select:none;`;
    document.body.appendChild(el);
    document.body.appendChild(icon);
    handIndicators.push({ el, icon });
  }
  return handIndicators[i];
}

function gameLoop() {
  if (!gameRunning) return;

  const sw = window.innerWidth, sh = window.innerHeight;
  ctx.clearRect(0, 0, sw, sh);

  // 每帧检测肤色
  detectSkinBlobs();
  detectGrabGesture();

  // 更新脸谱
  for (const m of maskObjs) m.update();
  // 绘制脸谱
  for (const m of maskObjs) m.draw(ctx);
  // 绘制已抓脸谱小图标
  drawCaughtIcons(ctx);

  // 更新多个手指示符
  for (let i = 0; i < MAX_HANDS; i++) {
    const hp = i < handPoints.length ? handPoints[i] : null;
    const ind = getHandIndicator(i);
    if (hp && hp.visible && hp.smoothX > 0) {
      ind.el.style.display = 'block';
      ind.el.style.left = hp.smoothX + 'px';
      ind.el.style.top = hp.smoothY + 'px';
      if (hp.grabbing) {
        ind.el.style.borderColor = '#FF4444';
        ind.el.style.background = 'rgba(255,68,68,0.25)';
      } else {
        ind.el.style.borderColor = i === 0 ? '#FFD700' : '#00FF88';
        ind.el.style.background = i === 0 ? 'rgba(255,215,0,0.15)' : 'rgba(0,255,136,0.15)';
      }
      ind.icon.style.display = 'block';
      ind.icon.style.left = hp.smoothX + 'px';
      ind.icon.style.top = hp.smoothY + 'px';
      ind.icon.textContent = hp.grabbing ? '✊' : '✋';
      ind.icon.style.color = hp.grabbing ? '#FF4444' : (i === 0 ? '#FFD700' : '#00FF88');
    } else {
      ind.el.style.display = 'none';
      ind.icon.style.display = 'none';
    }
  }

  // 原始 hand-indicator 隐藏（改用动态创建的指示符）
  handIndicator.style.display = 'none';
  handIcon.style.display = 'none';

  // 尝试抓取
  tryGrab();

  frameCount++;
  requestAnimationFrame(gameLoop);
}

// ===== 启动游戏 =====
async function startGame() {
  document.getElementById('start-screen').style.display = 'none';
  const ok = await initCamera();
  if (!ok) return; // showCameraError已处理，等用户选择

  await new Promise(r => {
    if (video.readyState >= 2) r();
    else video.onloadeddata = r;
  });

  _startGameInner();
}

function _startGameInner() {
  document.getElementById('score-bar').style.display = 'flex';
  document.getElementById('hint').style.display = 'block';
  updateUI();

  maskObjs = MASKS.map((m, i) => new MaskObj(m, i));
  gameRunning = true;
  caughtCount = 0;
  gameWon = false;
  caughtMasks = [];
  frameCount = 0;
  grabCooldownGlobal = 0;
  mouseInput.wasDown = false;
  touchPoints = [];

  // 重置多手点
  handPoints = [];
  for (let i = 0; i < MAX_HANDS; i++) handPoints.push(makeHandPoint());

  // 预加载SVG图片
  MASKS.forEach(m => drawSVGToCtx(ctx, m.svg, 0, 0, 1, 1));

  gameLoop();
  setTimeout(() => { document.getElementById('hint').style.display = 'none'; }, 5000);
}

function restartGame() {
  gameWon = false;
  caughtCount = 0;
  caughtMasks = [];
  gameRunning = false;
  maskObjs = [];
  document.getElementById('win-screen').style.display = 'none';
  _startGameInner();
}
</script>
